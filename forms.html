<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<form>>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Login</legend>
            <label for="user">username:</label>
            <input type="text" id="user" name="username"
            value="bhoomika" placeholder="enter username" required>
            <br><br>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="password"
            placeholder="enter password" required>
            <br><br>
            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="ph number">Phone number</label>
            <input type="tel" minlength="10" maxlength="10" id="ph number">
            <br><br>
            <label for="age">age:</label>
            <input type="number" min="18" max="25" placeholder="enter age">
            <br><br>
            <label for="gender">select gender</label>
            <input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">feMale
            <input type="radio" name="gender" value="others">others
            <br><br>
            <label for="states">select states</label>
            <select name="" id="">
                <option value="karnataka"></option>
                <option value="kerala"></option>
            </select>
            <br><br>
            <label for="checkbox">select skills</label>
            <input type="checkbox">java
            <input type="checkbox">python
            <br><br>
            <input type="search">
            <br><br>
            <input type="url">
            <br><br>
            <label for="address">enter address</label>
            <textarea name="address" rows="5" cols="12"></textarea>
            <br><br>
            <label for="dob">dob</label>
            <input type="datetime-local">
            <br><br>
            <label for="colour"></label>
            <input type="color">


            <button type="submit">submit</button>
            <button type="reset">cancel</button>
        </fieldset>
    </form>

</body>
</html>
