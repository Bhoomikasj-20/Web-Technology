<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .navbar{
            height: 70px;
            width: 100%;
            background-color: linear-gradient(to right, #dd1818, #333333); 
            display: flex;
        }
        .logo{
            height: 70px;
            flex-basis: 15%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo img{
            height: 65px;
            width: 65px;
            border-radius: 15px;
        }
        .menu{
            height: 70px;
            flex-basis: 85%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .menu a{
            text-decoration: none;
            color: goldenrod;
            font-size: large;
        }
        .menu a:hover{
            border-bottom: 2px solid goldenrod;
        }
        .icons{
            height: 70px;
            flex-basis: 15%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            color:rgb(16, 126, 221);
            font-size: xx-large;
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <aside class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4FVVsxN8ZdP4vAAvpQDKSsv60XEijMrR-Io9H5IrqDdrY5MnvT9gwLUw&s=10">
        </aside>
        <aside class="menu">
            <a href="">Home Page</a>
            <a href="">About Us</a>
            <a href="">Contact Us</a>
            <a href="">Profile</a>
            <a href=""><button>Login</button></a>
            <a href=""><button>Signup</button></a>
        </aside>
        <aside class="icons">
            <i class="fa-solid fa-camera-retro"></i>
            <i class="fa-brands fa-square-instagram"></i>
            <i class="fa-solid fa-user"></i>
        </aside>
    </nav>
</body>
</html>
