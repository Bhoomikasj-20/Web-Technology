<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .logo{
            height: 60px;
            flex-basis:15%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form{
           
            color:goldenrod;
            display:flex;
            align-content: center;
            justify-content: center;
            
        }
        .button{
            color:goldenrod;
            background-color: black;
        }
        .button:hover{
            background-color: goldenrod;
            color: black;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img id="logo" src="https://static.vecteezy.com/system/resources/thumbnails/024/131/476/small_2x/yves-saint-laurent-brand-logo-brown-symbol-clothes-design-icon-abstract-illustration-with-black-background-free-vector.jpg" alt="YSL Logo"  height="400px" width="400px" >
    </div>
    <br><br>
    <br>
    <br>
    <form class="form">
        <fieldset>
            <legend>Login</legend>
            <label for="user">username:</label>
            <input type="text" id="user" name="username"
            value="" placeholder="enter username"  required>
            <br><br>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="password"
            placeholder="enter password" required>
            <br><br>
            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email">
            <br><br>
            <button class="button" type="submit">submit</button> 
            <button class="button" type="reset">cancel</button>
    
        </fieldset>
    </form>
</body>
</html>
