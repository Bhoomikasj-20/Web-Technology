<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section {
            height: 400px;
            width: 400px;
            display: grid;
            border: 2px solid red;
            grid-template-columns:repeat(3,100px);
            grid-template-rows:repeat(3,100px);
            align-content:space-evenly;
            justify-content:space-evenly;
        }
    aside{
        border: 2px solid black;
    }
    </style>
</head>
<body>
    <section>
        <aside>1</aside>
        <aside>2</aside>
        <aside>3</aside>
        <aside>4</aside>
        <aside>5</aside>
        <aside>6</aside>
        <aside>7</aside>
        <aside>8</aside>
        <aside>9</aside>
    </section>
</body>
</html>
